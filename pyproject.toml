[project]
name = "aiopjlink2"
version = "1.0.7"
description = "Asyncio PJLink library (Class 1 and Class 2)"
readme = "README.md"
keywords = ["projector", "pjlink", "asyncio"]
dependencies = []
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]
license = {text = "MIT"}

[project.urls]
"Repository" = "https://github.com/jtjart/aiopjlink"
"Bug Tracker" = "https://github.com/jtjart/aiopjlink/issues"


[project.optional-dependencies]

[build-system]
requires = ["pdm-pep517>=1.0.0"]
build-backend = "pdm.pep517.api"

[tool]
[tool.pdm]
[tool.pdm.build]
includes = ["aiopjlink"]
excludes = ["test", "test/*"]

[tool.pdm.dev-dependencies]
dev = [
    "flake8>=5.0.4",
    "coverage>=6.4.3",
]

[tool.pdm.scripts]
lint = "python -m flake8 aiopjlink test"
test = "python -m unittest discover -v"
test_d.cmd = "python -m unittest discover -v"
test_d.env = {AIOPJLINK_PRINT_DEBUG_COMMS = "True"}

coverage = "coverage run -m unittest discover -v"
coverage_report = "coverage report"
coverage_html = "coverage html"

