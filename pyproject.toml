[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "aiopjlink2"
dynamic = ["version"]
description = "Asyncio PJLink library (Class 1 and Class 2)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["pjlink", "projector", "asyncio"]
classifiers = [
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["pyserial-asyncio-fast>=0.14"]

[project.urls]
Repository = "https://github.com/jtjart/aiopjlink"
Documentation = "https://github.com/jtjart/aiopjlink#readme"
Issues = "https://github.com/jtjart/aiopjlink/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/aiopjlink/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aiopjlink"]

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pyright[nodejs]",
    "ruff",
]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "RUF",   # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["SIM117"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"


# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["src"]

warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

check_untyped_defs = true

no_implicit_optional = true
no_implicit_reexport = true

strict_equality = true
show_error_codes = true
pretty = true


# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingImports = "error"


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["test"]


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["aiopjlink"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]
