[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "aiopjlink2"
dynamic = ["version"]
description = "Asyncio PJLink library (Class 1 and Class 2)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["pjlink", "projector", "asyncio"]
classifiers = [
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/jtjart/aiopjlink"
Documentation = "https://github.com/jtjart/aiopjlink#readme"
Issues = "https://github.com/jtjart/aiopjlink/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/aiopjlink/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aiopjlink"]

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pre-commit",
    "pyright[nodejs]",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "ruff",
]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "RUF",   # Ruff-specific
    "C90",   # mccabe
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"


# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = ["tests"]

strict = true
warn_unreachable = true
show_error_codes = true
pretty = true


# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingImports = "error"
executionEnvironments = [
    { root = "tests", extraPaths = [
        "src",
        "tests",
    ], reportPrivateUsage = "none" },
    { root = "src" },
]


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A test that waits forever (e.g. for a datagram that never comes) fails with its name and a traceback
# instead of holding up CI until the job times out. The slowest test takes a few seconds.
timeout = 60
pythonpath = ["src", "tests"]
testpaths = ["tests"]


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["aiopjlink"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]
