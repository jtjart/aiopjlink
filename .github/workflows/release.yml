name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build package
        run: uv build --no-sources

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - name: Verify version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          echo "Expected version: ${expected_version}"
          ls -1 dist/

          for file in \
            "dist/aiopjlink2-${expected_version}.tar.gz" \
            "dist/aiopjlink2-${expected_version}-py3-none-any.whl"; do
            if [[ ! -f "${file}" ]]; then
              echo "ERROR: ${file} not found: the release tag and the built package version do not match."
              exit 1
            fi
          done

          if [[ "$(ls -1 dist | wc -l)" -ne 2 ]]; then
            echo "ERROR: expected exactly one sdist and one wheel in dist/."
            exit 1
          fi

      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: pypi
      url: https://pypi.org/project/aiopjlink2/

    permissions:
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
