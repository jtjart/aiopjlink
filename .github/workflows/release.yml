name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build package
        run: uv build --no-sources

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - name: Verify version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          echo "Expected version: ${expected_version}"
          ls -1 dist/

          for file in \
            "dist/aiopjlink2-${expected_version}.tar.gz" \
            "dist/aiopjlink2-${expected_version}-py3-none-any.whl"; do
            if [[ ! -f "${file}" ]]; then
              echo "ERROR: ${file} not found: the release tag and the built package version do not match."
              exit 1
            fi
          done

          if [[ "$(ls -1 dist | wc -l)" -ne 2 ]]; then
            echo "ERROR: expected exactly one sdist and one wheel in dist/."
            exit 1
          fi

      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: pypi
      url: https://pypi.org/project/aiopjlink2/

    permissions:
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
