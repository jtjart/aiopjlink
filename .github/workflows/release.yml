name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install project
        run: uv sync --locked

      - name: Build package
        run: uv build --no-sources

      - name: Check package metadata
        run: uv run --with twine twine check dist/*

      - name: Verify version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_version="${RELEASE_TAG#v}"

          actual_version="$(
            uv run python -c \
              'import importlib.metadata; print(importlib.metadata.version("aiopjlink2"))'
          )"

          echo "Expected version: ${expected_version}"
          echo "Package version:  ${actual_version}"

          if [[ "${expected_version}" != "${actual_version}" ]]; then
            echo "ERROR: GitHub release tag and package version do not match."
            exit 1
          fi

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/aiopjlink2/

    permissions:
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
